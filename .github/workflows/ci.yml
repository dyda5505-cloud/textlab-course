name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build wheel and sdist
        run: python -m build
      - name: Run tests
        run: pytest --cov=textlab --cov-report=term-missing --cov-fail-under=85
      - name: Build containers and test async HTTP lifecycle
        run: |
          docker compose up --build -d --wait
          python tools/smoke.py
      - name: Save service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start monitoring stack
        run: docker compose -f compose.yaml -f compose.monitoring.yaml up --build -d --wait
      - name: Verify metrics, logs and provisioned dashboard
        run: docker compose -f compose.yaml -f compose.monitoring.yaml exec -T backend python tools/monitoring_smoke.py
      - name: Service logs
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml logs --no-color
      - name: Stop monitoring stack
        if: always()
        run: docker compose -f compose.yaml -f compose.monitoring.yaml down
  linux-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lab 4 image
        run: docker build --build-arg STUDENT=СкляровКА -t lab04 labs/docker
      - name: Execute Linux commands in container
        run: |
          set -o pipefail
          docker run --name lab04-session -d lab04 sleep infinity
          docker exec lab04-session bash /usr/local/bin/run-lab | tee lab04-execution.txt
      - name: Upload real execution log
        uses: actions/upload-artifact@v4
        with:
          name: lab04-execution
          path: lab04-execution.txt
