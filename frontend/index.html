<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ текста</title><style>
body{font:18px system-ui;background:#eef3f8;color:#172b43;max-width:820px;margin:50px auto;padding:20px}
textarea{box-sizing:border-box;width:100%;height:220px;padding:16px;font:inherit;border:1px solid #9babbe;border-radius:8px}
button{font:inherit;padding:12px 24px;background:#255ec2;color:white;border:0;border-radius:8px;margin-top:14px;cursor:pointer}
button:disabled{opacity:.5}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}
</style><main><h1>Анализ текста</h1><p>Подсчёт слов, уникальных слов и частот. Обработка выполняется в очереди.</p>
<label for="text">Текст для анализа</label><textarea id="text" maxlength="200000">Привет, мир! Привет, программная инженерия.</textarea>
<button id="run">Анализировать</button><p id="status" role="status" aria-live="polite"></p><pre id="result"></pre></main>
<script>
const button=document.querySelector('#run'), status=document.querySelector('#status'), result=document.querySelector('#result');
async function request(url,options){const r=await fetch(url,options); const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка сервера');return data;}
button.onclick=async()=>{button.disabled=true;result.textContent='';try{
 const job=await request('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value})});
 for(let i=0;i<120;i++){status.textContent='Задача в обработке…';await new Promise(r=>setTimeout(r,500));
  const data=await request('/api/jobs/'+encodeURIComponent(job.id));
  if(data.status==='failed')throw Error(data.error);
  if(data.status==='done'){status.textContent='Готово';const a=data.result;result.textContent=`Символов: ${a.characters}\nСлов: ${a.words}\nУникальных слов: ${a.unique_words}\n\nЧастые слова:\n`+a.top_words.map(x=>x.word+': '+x.count).join('\n');return;}}
 throw Error('Обработка занимает больше минуты. Проверьте доступность обработчика.');
 }catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
